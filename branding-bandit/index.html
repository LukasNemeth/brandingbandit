<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Budget Bandit</title>
<meta name="description" content="A 12-month marketing game for Czech business owners: Google, Sklik, Meta, TikTok, Heureka, Seznam Nákupy, Glami, Biano, Criteo, email, affiliate and marketplaces.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;600;700&display=swap">
<style>
/* Layout: night-market arcade. Glowing tool cards, gold money, glass chat. Phone = stacked; desktop = tools | board | chat.
   One deliberate dark look, set explicitly so it reads the same on any host theme. */
:root {
  --paper: #0A1024;
  --panel: #131D3D;
  --panel-2: #1B2752;
  --ink: #EEF2FF;
  --muted: #9CA8CB;
  --edge: rgba(255, 255, 255, .12);
  --soft: rgba(255, 255, 255, .09);
  --shadow-c: rgba(0, 0, 0, .5);
  --brand: #FFC83D;
  --brand-2: #FF8A1F;
  --brand-ink: #1C1300;
  --good: #3BE08F;
  --bad: #FF6B6B;
  --warn: #FFB547;
  --info: #84B6FF;
  --r-search: #4D8BFF;
  --r-aware: #FF4FA3;
  --r-compare: #FFB020;
  --r-retarget: #9B6BFF;
  --r-retain: #23D3A0;
  --r-sale: #A5D63A;
  --f-display: "Bricolage Grotesque", "Arial Black", system-ui, sans-serif;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  color: var(--ink);
  font: 400 1rem/1.45 var(--f-body);
  background:
    radial-gradient(900px 520px at 8% -8%, rgba(77, 139, 255, .22), transparent 62%),
    radial-gradient(760px 460px at 100% -4%, rgba(255, 200, 61, .14), transparent 60%),
    radial-gradient(rgba(255, 255, 255, .055) 1px, transparent 1.3px) 0 0 / 22px 22px,
    var(--paper);
  min-height: 100vh;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }
.wrap { max-width: 1280px; margin-inline: auto; padding-inline: 16px; padding-block: 14px 28px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.num { font-variant-numeric: tabular-nums; }
.good { color: var(--good); }
.bad { color: var(--bad); }
.warn { color: var(--warn); }
.muted { color: var(--muted); }

/* Building blocks */
.box {
  background: linear-gradient(180deg, rgba(255, 255, 255, .045), rgba(255, 255, 255, 0) 40%), var(--panel);
  border: 1px solid var(--edge);
  border-radius: 18px;
  box-shadow: 0 14px 34px -18px rgba(0, 0, 0, .7), inset 0 1px 0 rgba(255, 255, 255, .06);
}
.btn {
  appearance: none; cursor: pointer; min-height: 48px; padding: 10px 18px;
  border: 1px solid var(--edge); border-radius: 14px; background: var(--panel-2); color: var(--ink);
  font: 700 1rem/1.1 var(--f-body); box-shadow: 0 4px 0 rgba(0, 0, 0, .45);
  transition: transform .08s ease, box-shadow .08s ease, filter .15s ease;
}
.btn:hover { filter: brightness(1.12); }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0, 0, 0, .45); }
.btn.primary {
  background: linear-gradient(180deg, #FFE27A, var(--brand) 42%, var(--brand-2));
  color: var(--brand-ink); border-color: #FFE6A0;
  box-shadow: 0 5px 0 #A84F00, 0 14px 34px -10px rgba(255, 170, 40, .6);
  text-shadow: 0 1px 0 rgba(255, 255, 255, .35);
}
.btn.primary:active { box-shadow: 0 2px 0 #A84F00, 0 8px 20px -10px rgba(255, 170, 40, .6); }
.btn.big { min-height: 60px; font: 800 1.2rem/1.1 var(--f-display); padding-inline: 24px; letter-spacing: .01em; }
.btn[disabled] { opacity: .45; cursor: not-allowed; filter: grayscale(.5); }
.seg { display: inline-flex; flex-wrap: wrap; gap: 8px; }
.seg button {
  appearance: none; cursor: pointer; min-height: 46px; min-width: 46px; padding: 8px 16px;
  border: 1px solid var(--edge); border-radius: 999px; background: var(--panel-2); font-weight: 800;
  box-shadow: 0 3px 0 rgba(0, 0, 0, .4);
}
.seg button[aria-pressed="true"] { background: linear-gradient(180deg, #FFE27A, var(--brand) 50%, var(--brand-2)); color: var(--brand-ink); border-color: #FFE6A0; }
.seg button[disabled] { opacity: .45; cursor: not-allowed; }
.chip {
  display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 999px;
  border: 1px solid color-mix(in srgb, currentColor 55%, transparent);
  background: color-mix(in srgb, currentColor 14%, transparent);
  font: 800 .78rem/1.2 var(--f-body); white-space: nowrap; font-variant-numeric: tabular-nums;
}
.chip.good { color: var(--good); }
.chip.bad { color: var(--bad); }
.chip.warn { color: var(--warn); }
.chip.info { color: var(--info); }
.chip.plain { color: var(--muted); }

/* Brand */
.logo { display: inline-flex; align-items: center; gap: 10px; font: 800 1.3rem/1 var(--f-display); letter-spacing: -.01em; }
.logo svg { width: 40px; height: 40px; flex: none; filter: drop-shadow(0 6px 14px rgba(255, 200, 61, .35)); }
.topline { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }

/* Start screen */
.hero { padding-block: 18px 0; }
.wordmark {
  font: 800 clamp(2.8rem, 10vw, 5.6rem)/.86 var(--f-display); letter-spacing: -.035em; text-transform: uppercase;
  background: linear-gradient(100deg, #FFE27A 0%, var(--brand) 30%, var(--brand-2) 62%, var(--r-aware) 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 10px 30px rgba(255, 138, 31, .28));
}
.hero h1 { font: 700 clamp(1.15rem, 3.2vw, 1.6rem)/1.25 var(--f-body); margin: 14px 0 0; color: var(--ink); text-wrap: balance; max-width: 34ch; }
.marquee { overflow: hidden; margin: 22px -16px 4px; padding-block: 4px; mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent); -webkit-mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent); }
.marquee-row { display: flex; gap: 10px; width: max-content; animation: slideL 38s linear infinite; padding-block: 5px; }
.marquee-row.rev { animation-name: slideR; animation-duration: 44s; }
.mq-chip {
  display: inline-flex; align-items: center; gap: 8px; padding: 7px 14px 7px 7px; border-radius: 999px;
  background: color-mix(in srgb, var(--c) 16%, var(--panel)); border: 1px solid color-mix(in srgb, var(--c) 50%, transparent);
  font-weight: 800; white-space: nowrap; box-shadow: 0 8px 20px -12px var(--c);
}
.mq-chip .ico { width: 28px; height: 28px; }
.tool-strip { display: none; }
.pick-title { font: 800 .78rem/1 var(--f-body); text-transform: uppercase; letter-spacing: .14em; color: var(--muted); margin: 20px 0 10px; }
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 760px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.tile {
  appearance: none; cursor: pointer; text-align: left; padding: 16px; display: grid; gap: 10px; min-height: 148px; position: relative;
  background: radial-gradient(130% 100% at 0% 0%, color-mix(in srgb, var(--c) 34%, transparent), transparent 58%), var(--panel);
  transition: transform .15s ease, box-shadow .15s ease;
}
.tile:hover { transform: translateY(-3px); }
.tile .tile-ico {
  width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; color: #fff;
  background: linear-gradient(145deg, color-mix(in srgb, var(--c) 85%, #fff), var(--c) 55%, color-mix(in srgb, var(--c) 70%, #000));
  box-shadow: 0 10px 22px -8px var(--c), inset 0 1px 0 rgba(255, 255, 255, .45);
}
.tile svg { width: 30px; height: 30px; }
.tile b { font: 800 1.12rem/1.15 var(--f-display); }
.tile .mini { font-size: .84rem; color: var(--muted); font-weight: 600; }
.tile[aria-pressed="true"] { border-color: var(--brand); box-shadow: 0 0 0 2px var(--brand), 0 18px 40px -16px rgba(255, 200, 61, .55); }
.tile[aria-pressed="true"]::after {
  content: "✓"; position: absolute; top: 12px; right: 12px; width: 26px; height: 26px; border-radius: 50%;
  display: grid; place-items: center; font-weight: 900; color: var(--brand-ink); background: var(--brand);
}
.start-row { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; margin-top: 26px; }
.opts { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 4px 36px; }
.opts .start-row { margin-top: 18px; margin-left: auto; }
@media (max-width: 760px) { .opts .start-row { margin-left: 0; width: 100%; } .opts .start-row .btn { flex: 1 1 auto; } }
.mstats { padding: 12px 14px; }
.mstats .k { font: 800 .66rem/1.1 var(--f-body); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
.mstats-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 10px; }
.mstat { background: rgba(255, 255, 255, .05); border: 1px solid var(--soft); border-radius: 14px; padding: 10px 12px; min-width: 0; }
.mstat small { display: block; color: var(--muted); font-weight: 800; font-size: .7rem; }
.mstat b { font: 800 1.15rem/1.2 var(--f-display); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.best { color: var(--brand); font-weight: 800; }

/* Game layout */
.game { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
.bar {
  display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center; padding: 10px 14px;
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: rgba(19, 29, 61, .82); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
}
.cash { display: grid; line-height: 1.05; }
.cash small { font-size: .7rem; color: var(--muted); font-weight: 800; text-transform: uppercase; letter-spacing: .12em; }
.cash strong { font: 800 1.6rem/1.1 var(--f-display); font-variant-numeric: tabular-nums; color: var(--brand); text-shadow: 0 0 22px rgba(255, 200, 61, .35); transition: color .3s ease; }
.cash strong.up { animation: glowUp .7s ease; }
.cash strong.down { animation: glowDown .7s ease; }
.months { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 4px; min-width: 0; }
.mcell {
  height: 30px; border-radius: 9px; border: 1px solid var(--soft); background: rgba(255, 255, 255, .03);
  display: grid; place-items: center; font: 800 .68rem/1 var(--f-body); color: var(--muted); overflow: hidden; letter-spacing: -.05em;
}
.mcell.now { border-color: var(--brand); color: var(--ink); animation: ring 1.6s ease-in-out infinite; }
.mcell.done { border-color: rgba(255, 200, 61, .55); background: linear-gradient(180deg, rgba(255, 200, 61, .3), rgba(255, 138, 31, .14)); color: var(--brand); text-shadow: 0 0 8px rgba(255, 200, 61, .6); }
.mcell.lost { background: rgba(255, 107, 107, .12); border-color: rgba(255, 107, 107, .6); color: var(--bad); }
.bar-tools { display: flex; gap: 8px; align-items: center; }
.icon-btn { appearance: none; cursor: pointer; min-width: 44px; min-height: 44px; border: 1px solid var(--edge); border-radius: 12px; background: var(--panel-2); font-weight: 800; box-shadow: 0 3px 0 rgba(0, 0, 0, .4); }
.icon-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0, 0, 0, .4); }

.board { display: grid; gap: 14px; }
.meters { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.meter { padding: 12px; display: grid; gap: 7px; min-width: 0; }
.meter .k { font: 800 .66rem/1.1 var(--f-body); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
.meter .v { font: 800 1.3rem/1 var(--f-display); font-variant-numeric: tabular-nums; }
.meter .track { height: 9px; border-radius: 99px; background: rgba(255, 255, 255, .07); overflow: hidden; }
.meter .fill { height: 100%; width: 0; border-radius: 99px; background: linear-gradient(90deg, color-mix(in srgb, var(--c) 70%, #000), var(--c)); box-shadow: 0 0 12px var(--c); transition: width .6s cubic-bezier(.3, 1.3, .5, 1); }

.playzone { display: grid; gap: 10px; }
.playzone .btn { width: 100%; }
.weekline { display: flex; justify-content: space-between; gap: 8px; font-weight: 800; font-size: .85rem; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.spark { padding: 12px 14px; }
.spark svg { width: 100%; height: 110px; display: block; overflow: visible; }
.spark .k { font: 800 .66rem/1.1 var(--f-body); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }

.feedbox { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; min-height: 0; overflow: hidden; background: rgba(19, 29, 61, .78); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.feedbox.shake { animation: shake .45s ease; }
.feedhead { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--soft); font: 800 1rem/1 var(--f-display); }
.feedhead > span:first-child::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--good); box-shadow: 0 0 10px var(--good); margin-right: 8px; vertical-align: middle; animation: blink 2s ease-in-out infinite; }
.feed { overflow-y: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 10px; scroll-behavior: smooth; }
.msg { display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; gap: 8px; align-items: start; }
.av {
  width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font: 900 .85rem/1 var(--f-body); color: #fff;
  background: linear-gradient(145deg, color-mix(in srgb, var(--c) 80%, #fff), var(--c) 55%, color-mix(in srgb, var(--c) 65%, #000));
  box-shadow: 0 6px 14px -6px var(--c); text-shadow: 0 1px 2px rgba(0, 0, 0, .4);
}
.av svg { width: 19px; height: 19px; }
.bubble { position: relative; background: rgba(255, 255, 255, .07); border: 1px solid var(--soft); border-radius: 4px 16px 16px 16px; padding: 7px 12px; min-width: 0; }
.bubble .who { display: block; font: 800 .7rem/1.2 var(--f-body); color: var(--muted); letter-spacing: .02em; }
.bubble .txt { font-weight: 700; overflow-wrap: anywhere; }
.msg .chip { margin-top: 6px; }
.msg.me { grid-template-columns: minmax(0, 1fr); justify-items: end; }
.msg.me .bubble { background: linear-gradient(180deg, #FFE27A, var(--brand) 60%, var(--brand-2)); color: var(--brand-ink); border-color: transparent; border-radius: 16px 4px 16px 16px; }
.msg.boss .bubble { background: linear-gradient(135deg, rgba(255, 79, 163, .22), rgba(255, 200, 61, .16)); border: 1px solid rgba(255, 200, 61, .55); box-shadow: 0 0 22px -6px rgba(255, 138, 31, .5); }
.stamp {
  position: relative; align-self: center; display: grid; justify-items: center; gap: 3px; padding: 12px 22px;
  border: 2px dashed rgba(255, 200, 61, .6); border-radius: 16px; text-align: center; background: rgba(255, 200, 61, .06);
  animation: thud .5s cubic-bezier(.3, 1.6, .5, 1) both;
}
.stamp b { font: 800 1.05rem/1.1 var(--f-display); text-transform: uppercase; letter-spacing: .08em; }
.stamp .stars { font-size: 1.45rem; letter-spacing: 3px; color: var(--brand); text-shadow: 0 0 14px rgba(255, 200, 61, .7); }
.replies { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px; border-top: 1px solid var(--soft); background: rgba(255, 200, 61, .05); }
.replies:empty { display: none; }
.replies .btn { flex: 1 1 140px; min-height: 54px; }
.replies .btn:first-child { background: linear-gradient(180deg, #FFE27A, var(--brand) 42%, var(--brand-2)); color: var(--brand-ink); border-color: #FFE6A0; box-shadow: 0 4px 0 #A84F00; }
.replies .btn small { display: block; font-weight: 700; font-size: .76rem; opacity: .8; margin-top: 2px; }

.dock { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.tool {
  appearance: none; cursor: pointer; text-align: left; padding: 11px; min-height: 112px; color: var(--ink);
  display: grid; grid-template-rows: auto auto 1fr; gap: 7px; position: relative; min-width: 0;
  background:
    radial-gradient(120% 90% at 0% 0%, color-mix(in srgb, var(--c) 36%, transparent), transparent 62%),
    linear-gradient(180deg, color-mix(in srgb, var(--c) 12%, var(--panel)), var(--panel));
  border: 1px solid color-mix(in srgb, var(--c) 48%, transparent);
  border-radius: 18px;
  box-shadow: 0 12px 26px -16px var(--c), inset 0 1px 0 rgba(255, 255, 255, .08);
  transition: transform .15s ease, box-shadow .15s ease;
}
.tool:hover { transform: translateY(-2px); box-shadow: 0 16px 30px -14px var(--c), inset 0 1px 0 rgba(255, 255, 255, .1); }
.tool .top { display: flex; align-items: center; gap: 9px; min-width: 0; }
.badge {
  width: 36px; height: 36px; flex: none; border-radius: 12px; display: grid; place-items: center; color: #fff;
  background: linear-gradient(145deg, color-mix(in srgb, var(--c) 85%, #fff), var(--c) 55%, color-mix(in srgb, var(--c) 68%, #000));
  box-shadow: 0 6px 14px -6px var(--c), inset 0 1px 0 rgba(255, 255, 255, .45);
}
.badge svg { width: 20px; height: 20px; }
.tool .nm { display: grid; gap: 3px; min-width: 0; }
.tool .name { display: block; font: 800 .9rem/1.1 var(--f-display); overflow-wrap: break-word; hyphens: auto; }
.tool .role { display: block; font: 800 .6rem/1 var(--f-body); text-transform: uppercase; letter-spacing: .1em; color: color-mix(in srgb, var(--c) 70%, #fff); }
.tool .budget { font: 800 1.2rem/1 var(--f-display); font-variant-numeric: tabular-nums; }
.tool .res { font: 800 .74rem/1.2 var(--f-body); align-self: end; justify-self: start; font-variant-numeric: tabular-nums; padding: 3px 8px; border-radius: 999px; background: rgba(0, 0, 0, .25); }
.tool .res.muted { background: none; padding-inline: 0; }
.tool.off { background: var(--panel); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .05); }
.tool.off .budget { color: var(--muted); }
.tool.off .badge { filter: saturate(.55) brightness(.85); }
.tool.locked { border: 1px dashed rgba(255, 255, 255, .28); background: rgba(255, 255, 255, .025); box-shadow: none; }
.tool.locked .badge { filter: grayscale(.85) brightness(.75); }
.tool.locked .budget { font-size: .95rem; color: var(--warn); }
.tool.bump { animation: bump .4s ease; }
.float { position: absolute; right: 10px; top: 8px; font: 900 .95rem/1 var(--f-display); color: var(--brand); text-shadow: 0 0 10px rgba(255, 200, 61, .8); animation: rise 1s ease forwards; pointer-events: none; }
.playbar { position: sticky; bottom: 0; padding-block: 10px calc(10px + env(safe-area-inset-bottom, 0px)); z-index: 4; background: linear-gradient(to top, var(--paper) 78%, rgba(10, 16, 36, 0)); }
.playbar.phone-only .weekline { display: none; }

/* Coins and confetti */
.coin {
  position: fixed; left: 0; top: 0; width: 16px; height: 16px; border-radius: 50%; z-index: 40; pointer-events: none;
  background: radial-gradient(circle at 35% 32%, #FFF6C4, #FFC83D 45%, #C77700 100%);
  box-shadow: 0 0 10px rgba(255, 200, 61, .85);
  animation: fly .8s cubic-bezier(.45, -0.25, .6, 1) both;
}
.burst { position: absolute; left: 50%; top: 50%; width: 0; height: 0; pointer-events: none; }
.cf { position: absolute; width: 7px; height: 11px; border-radius: 2px; background: var(--c); animation: burst 1.1s cubic-bezier(.2, .7, .3, 1) forwards; }

@media (max-width: 999px) {
  .feedbox { height: 46vh; min-height: 300px; }
  .desk-only { display: none !important; }
}
@media (min-width: 1000px) {
  .game { grid-template-columns: 340px minmax(0, 1fr) 380px; grid-template-areas: "bar bar bar" "tools board feed"; align-items: start; }
  .bar { grid-area: bar; }
  .toolscol { grid-area: tools; }
  .board { grid-area: board; }
  .feedbox { grid-area: feed; height: calc(100vh - 124px); position: sticky; top: 96px; }
  .dock { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .phone-only { display: none !important; }
  .playbar { position: static; background: none; padding: 0; }
}
@media (max-width: 420px) {
  .dock { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .cash strong { font-size: 1.3rem; }
  .months { gap: 2px; }
  .months .mcell { font-size: .55rem; height: 26px; border-radius: 6px; }
}

/* Sheet (bottom sheet on phone, dialog on desktop) */
.layer { position: fixed; inset: 0; background: rgba(4, 7, 18, .7); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); z-index: 20; display: grid; align-items: end; justify-items: center; }
.sheet { width: min(560px, 100%); max-height: 88vh; overflow-y: auto; border-radius: 24px 24px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom, 0px)); animation: slide .25s ease both;
  background: radial-gradient(120% 60% at 0% 0%, color-mix(in srgb, var(--c, var(--brand)) 26%, transparent), transparent 60%), var(--panel); }
@media (min-width: 700px) { .layer { align-items: center; } .sheet { border-radius: 24px; } }
.sheet-head { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
.sheet-head .badge { width: 46px; height: 46px; border-radius: 14px; }
.sheet-head .badge svg { width: 26px; height: 26px; }
.sheet-head h2 { font: 800 1.5rem/1.1 var(--f-display); margin: 0; flex: 1; min-width: 0; }

<div class="wrap" id="root"></div>
<div class="layer" id="layer" hidden></div>
<noscript><p class="wrap">Budget Bandit needs JavaScript.</p></noscript>
<script>
/* Budget Bandit engine. Pure model, no DOM. One game = 48 weeks (12 months x 4). */
var BBEngine = (function () {
  'use strict';

  var WEEKS = 48;
  var WPM = 4;                 // weeks per month
  var BF_WEEK = 43;            // Black Friday: last week of November
  var CUTOFF_WEEK = 47;        // Christmas shipping cut-off
  var NOISE = 0.07;
  var BUZZ_KEEP = 0.75;        // share of Buzz left after a week
  var BRAND_CVR = 0.06;        // brand searchers who buy (assumption)
  var SIZES = { s: 0.25, m: 1, l: 3 };   // about 2M, 8M and 25M Kč revenue a year
  var FIXED_SIZE = { s: 0.2, m: 1, l: 3 }; // small shops run leaner
  var SETUP = { feed: 5000, video: 10000, flows: 8000 };
  var CREATIVE_REFRESH = 5000;
  var INFLUENCER_FEE = 12000;  // micro creator post: 3,000-15,000 Kč (infl.cz)

  /* Business profiles. Margins, fixed costs and organic orders are planning assumptions. */
  var PROFILES = {
    fashion: { eshop: true, reach: 0.6, cash: 500000, aov: 1100, margin: 0.45, fixed: 110000, organic: 30, reorder: 1.0, niche: 'glami', market: 0.13, list: 3000, cvr: { meta: 0.0279, tiktok: 0.012 } },
    home: { eshop: true, reach: 0.28, cash: 600000, aov: 2400, margin: 0.40, fixed: 150000, organic: 14, reorder: 0.5, niche: 'biano', market: 0.11, list: 2000, cvr: { meta: 0.0169, tiktok: 0.012 } },
    electronics: { eshop: true, reach: 0.3, cash: 400000, aov: 3800, margin: 0.12, fixed: 30000, organic: 10, reorder: 0.6, niche: null, market: 0.07, list: 2000, cvr: { meta: 0.012, tiktok: 0.012 }, heurekaCpc: 7.22 },
    service: { eshop: false, reach: 0.1, cash: 400000, aov: 6000, margin: 0.35, fixed: 120000, organic: 8, reorder: 0.3, niche: null, market: 0, list: 800, cvr: { meta: 0.0169, tiktok: 0.006 }, metaCpc: 23.82 }
  };

  /* Tools. cpc in Kč, reach = clicks a week for a ~8M Kč business, cvr = real orders per click.
     model: 'auction' (clicks saturate as you bid up) or 'list' (price-list CPC, linear until shoppers run out).
     claim = how much the platform over-reports its own orders (game assumption, see sources). */
  var TOOLS = {
    google: { role: 'search', model: 'auction', cpc: 10.61, reach: 3000, demand: true, cvr: 0.0311, claim: 1.0, brandClaim: 0.7, q: 'M' },
    sklik: { role: 'search', model: 'auction', cpc: 4.62, reach: 2000, demand: true, cvr: 0.0311, claim: 1.0, brandClaim: 0.3, q: 'P' },
    pmax: { role: 'search', model: 'auction', cpc: 9.07, reach: 2500, demand: true, cvr: 0.0211, claim: 1.0, brandClaim: 0.5, needs: 'feed', learn: true, eshop: true, q: 'D' },
    meta: { role: 'aware', model: 'auction', cpc: 11.74, reach: 5000, demand: false, claim: 1.6, buzz: 0.012, learn: true, fatigue: 0.03, q: 'D' },
    tiktok: { role: 'aware', model: 'auction', cpc: 4.73, reach: 8000, demand: false, claim: 2.0, buzz: 0.008, needs: 'video', fatigue: 0.06, q: 'D' },
    heureka: { role: 'compare', model: 'list', cpc: 7.94, reach: 1250, demand: true, cvr: 0.03, claim: 1.1, needs: 'feed', uplift: true, eshop: true, q: 'L' },
    nakupy: { role: 'compare', model: 'list', cpc: 3.0, reach: 600, demand: true, cvr: 0.03, claim: 1.1, needs: 'feed', eshop: true, q: 'L' },
    glami: { role: 'compare', model: 'list', cpc: 5.0, reach: 800, demand: true, cvr: 0.02, claim: 1.1, needs: 'feed', niche: 'glami', eshop: true, q: 'L' },
    biano: { role: 'compare', model: 'list', cpc: 4.75, reach: 800, demand: true, cvr: 0.01, claim: 1.1, needs: 'feed', niche: 'biano', eshop: true, q: 'L' },
    criteo: { role: 'retarget', model: 'auction', cpc: 15.96, poolShare: 0.025, cvr: 0.019, claim: 2.0, needs: 'feed', eshop: true, q: 'L' },
    email: { role: 'retain', model: 'email', q: 'D' },
    affiliate: { role: 'sale', model: 'affiliate', eshop: true, q: 'L' },
    market: { role: 'sale', model: 'market', eshop: true, q: 'M' }
  };
  var ORDER = ['google', 'sklik', 'pmax', 'meta', 'tiktok', 'heureka', 'nakupy', 'glami', 'biano', 'criteo', 'email', 'affiliate', 'market'];
  var PAID = ['google', 'sklik', 'pmax', 'meta', 'tiktok', 'heureka', 'nakupy', 'glami', 'biano', 'criteo'];
  var EMAIL_SENDS = [0, 0.25, 1, 3];          // off, monthly, weekly, 3x a week
  var EMAIL_ORDER_RATE = 0.0016;              // campaign placed-order rate (Klaviyo benchmarks)
  var FLOW_ORDER_RATE = 0.0211;               // flow placed-order rate (Klaviyo benchmarks)
  var EMAIL_COST_CONTACT_MONTH = 0.3;         // Kč per contact a month (assumption)
  var AFFILIATE_STEPS = [0, 0.05, 0.08, 0.12];
  var AFFILIATE_REAL = 0.6;                   // share of tracked affiliate orders that are truly extra (assumption)
  var AFFILIATE_FEE_WEEK = 500;
  var MARKET_FEE_WEEK = 970 / 4;              // Kaufland basic fee 39.95 EUR a month
  var MARKET_PRICE_CUT = 0.05;                // price pressure on marketplaces (assumption)

  function demandIndex(w) {
    // Jan-Sep = 1. Oct-Dec carry one third of the year (APEK), Black Friday week about 4.1% of the year.
    if (w === BF_WEEK) return 2.42;
    if (w >= 36) return 1.416;
    return 1;
  }
  function heurekaUplift(w) { return (w <= 3 || w >= 40) ? 1.25 : 1; } // Nov-Jan +25% (Heureka price rules)
  function monthOf(w) { return Math.floor(w / WPM); }

  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function available(profileId) {
    var p = PROFILES[profileId];
    return ORDER.filter(function (id) {
      var t = TOOLS[id];
      if (t.eshop && !p.eshop) return false;
      if (t.niche && t.niche !== p.niche) return false;
      return true;
    });
  }

  function budgetSteps(s) {
    return [0, 10000, 25000, 50000, 100000].map(function (v) { return Math.round(v * s / 500) * 500; });
  }

  function newGame(opts) {
    var p = PROFILES[opts.profile];
    var s = SIZES[opts.size] || 1;
    var seed = opts.seed >>> 0;
    var ev = mulberry32(seed ^ 0x9E3779B9);   // event schedule: same for everyone with this seed
    var schedule = {
      ios: 10 + Math.floor(ev() * 10),
      war: 16 + Math.floor(ev() * 14),
      surge: 20 + Math.floor(ev() * 12),
      infl: [6 + Math.floor(ev() * 8), 28 + Math.floor(ev() * 8)],
      viral: []
    };
    for (var i = 0; i < WEEKS; i++) schedule.viral.push(ev() < 0.04);
    var budgets = {};
    PAID.forEach(function (id) { budgets[id] = 0; });
    var steps = budgetSteps(s);
    budgets.google = steps[2];
    budgets.sklik = steps[1];
    budgets.meta = steps[2];
    var g = {
      profile: opts.profile, sizeKey: opts.size, s: s, seed: seed, daily: !!opts.daily,
      week: 0, cash: p.cash * s, startCash: p.cash * s, fixedMonth: p.fixed * (FIXED_SIZE[opts.size] || 1), oneOff: 0, bailoutCash: 0,
      budgets: budgets, prevBudgets: {},
      email: { freq: 0, flows: false }, affiliate: 0, market: false,
      ready: { feed: null, video: null, flows: null },
      list: Math.round(p.list * s), buzz: 0, buzzBy: { meta: 0, tiktok: 0, infl: 0 },
      pool: [0, 0, 0, 0], lastVisitors: 0, lastNewSubs: 0,
      conv: { meta: 0, pmax: 0 }, fatigue: { meta: 0, tiktok: 0 }, swing: { meta: 0, pmax: 0, tiktok: 0 },
      priceWar: { until: -1, matched: false }, surgeUntil: -1, ios: false,
      bf: null, cutoff: null, pendingInfl: 0, decisions: {}, offered: {},
      schedule: schedule, rng: mulberry32(seed), bailouts: 0, over: null,
      weeks: [], months: []
    };
    PAID.forEach(function (id) { g.prevBudgets[id] = 0; });
    return g;
  }

  function isReady(g, id) {
    var need = TOOLS[id].needs;
    if (!need) return true;
    return g.ready[need] !== null && g.ready[need] <= g.week;
  }

  function setup(g, what) {
    if (g.ready[what] !== null) return false;
    g.cash -= SETUP[what];
    g.oneOff += SETUP[what];
    g.ready[what] = g.week + 1;
    return true;
  }

  /* Called when the player starts a month: detect big budget swings (learning resets). */
  function startMonth(g) {
    ['meta', 'pmax', 'tiktok'].forEach(function (id) {
      var prev = g.prevBudgets[id] || 0, now = g.budgets[id] || 0;
      if (prev > 0 && now > 0 && Math.abs(now - prev) / prev > 0.5) g.swing[id] = 2;
    });
    PAID.forEach(function (id) { g.prevBudgets[id] = g.budgets[id] || 0; });
  }

  function decisionFor(g) {
    var w = g.week, p = PROFILES[g.profile];
    var list = [];
    if (g.schedule.infl.indexOf(w) !== -1) list.push({ key: 'infl' + w, type: 'influencer', options: ['yes', 'no'], cost: INFLUENCER_FEE });
    if (p.eshop && w === g.schedule.war && ((g.budgets.heureka > 0 && isReady(g, 'heureka')) || (g.budgets.nakupy > 0 && isReady(g, 'nakupy')))) list.push({ key: 'war', type: 'pricewar', options: ['match', 'keep'] });
    if (w === BF_WEEK - 1) list.push({ key: 'bf', type: 'blackfriday', options: ['all', 'search', 'skip'] });
    if (w === CUTOFF_WEEK && p.eshop) list.push({ key: 'cutoff', type: 'cutoff', options: ['pause', 'keep'] });
    ['meta', 'tiktok'].forEach(function (id) {
      if (g.fatigue[id] >= 0.2 && (g.budgets[id] || 0) > 0 && isReady(g, id)) {
        var last = g.offered[id] === undefined ? -99 : g.offered[id];
        if (w - last >= 4) list.push({ key: 'cr_' + id + w, type: 'creatives', tool: id, options: ['yes', 'no'], cost: CREATIVE_REFRESH });
      }
    });
    for (var i = 0; i < list.length; i++) if (g.decisions[list[i].key] === undefined) return list[i];
    return null;
  }

  function decide(g, d, choice) {
    g.decisions[d.key] = choice;
    var s = g.s;
    if (d.type === 'influencer' && choice === 'yes') {
      g.cash -= INFLUENCER_FEE; g.oneOff += INFLUENCER_FEE;
      var pr = PROFILES[g.profile].reach;
      g.buzz += 120 * s * pr; g.buzzBy.infl += 120 * s * pr;
      g.pendingInfl += Math.round(6 * s * pr);
    }
    if (d.type === 'pricewar') g.priceWar = { until: g.week + 4, matched: choice === 'match' };
    if (d.type === 'blackfriday') g.bf = choice;
    if (d.type === 'cutoff') g.cutoff = choice;
    if (d.type === 'creatives') {
      g.offered[d.tool] = g.week;
      if (choice === 'yes') { g.cash -= CREATIVE_REFRESH; g.oneOff += CREATIVE_REFRESH; g.fatigue[d.tool] = 0; }
    }
  }

  function cpcFor(g, id, w) {
    var t = TOOLS[id], p = PROFILES[g.profile];
    var c = t.cpc;
    if (id === 'meta' && p.metaCpc) c = p.metaCpc;
    if (id === 'heureka' && p.heurekaCpc) c = p.heurekaCpc;
    if (t.uplift) c *= heurekaUplift(w);
    if (t.fatigue) c *= 1 + g.fatigue[id];
    if (id === 'google' && w < g.surgeUntil) c *= 1.25;
    return c;
  }
  function cvrFor(g, id) {
    var t = TOOLS[id], p = PROFILES[g.profile];
    return (p.cvr[id] !== undefined) ? p.cvr[id] : t.cvr;
  }
  function reachFor(g, id, w, poolTotal) {
    var t = TOOLS[id];
    if (id === 'criteo') return Math.max(1, poolTotal * t.poolShare);
    var r = t.reach * g.s * PROFILES[g.profile].reach;
    if (t.demand) r *= demandIndex(w);
    return r;
  }

  function stepWeek(g) {
    if (g.over || g.week >= WEEKS) return null;
    var pending = decisionFor(g);
    if (pending) return { decision: pending };

    var w = g.week, p = PROFILES[g.profile], s = g.s, rng = g.rng;
    var idx = demandIndex(w);
    function jit() { return 1 - NOISE + 2 * NOISE * rng(); }
    if (w === g.schedule.surge) g.surgeUntil = w + 2;
    var events = [];
    if (w === g.schedule.ios && !g.ios) { g.ios = true; events.push('ios'); }
    if (w === g.schedule.surge) events.push('surge');
    if (w === BF_WEEK) events.push('bf');

    var warOn = w < g.priceWar.until;
    var margin = p.margin - ((warOn && g.priceWar.matched) ? 0.03 : 0);
    var poolTotal = g.pool.reduce(function (a, b) { return a + b; }, 0);
    var cutFactor = (w === CUTOFF_WEEK && g.cutoff === 'keep') ? 0.75 : 1;
    var R = { week: w, month: monthOf(w), idx: idx, tools: {}, events: events, spend: 0, costs: 0, gross: 0, rev: 0, orders: 0, claimRev: 0, visitors: 0 };
    var visitors = 0, shopOrders = 0;

    available(g.profile).forEach(function (id) {
      var t = TOOLS[id];
      if (PAID.indexOf(id) === -1) return;
      var rec = { id: id, spend: 0, clicks: 0, orders: 0, halo: 0, rev: 0, claimRev: 0, capped: false, cpc: cpcFor(g, id, w), used: 0, ready: isReady(g, id) };
      R.tools[id] = rec;
      var b = (g.budgets[id] || 0) / WPM;
      if (w === BF_WEEK && g.bf === 'all') b *= 2;
      if (w === BF_WEEK && g.bf === 'search' && (t.role === 'search' || t.role === 'compare')) b *= 2;
      if (w === CUTOFF_WEEK && g.cutoff === 'pause') b = 0;
      if (!rec.ready || b <= 0) return;
      var reach = reachFor(g, id, w, poolTotal);
      var cpc = rec.cpc, clicks, spend;
      if (t.model === 'list') {
        clicks = Math.min(b / cpc, reach);
        rec.capped = b / cpc > reach * 0.98;
        clicks = Math.round(clicks * jit());
        spend = Math.min(b, clicks * cpc);
      } else {
        clicks = reach * (1 - Math.exp(-b / (cpc * reach)));
        rec.used = clicks / reach;
        clicks = Math.round(clicks * jit());
        spend = b;
      }
      var eff = 1;
      if (t.learn) eff *= 0.6 + 0.4 * Math.min(1, g.conv[id] / 50);
      if (g.swing[id] > 0) eff *= 0.85;
      if (warOn && !g.priceWar.matched && t.role === 'compare') eff *= 0.6;
      var orders = Math.round(clicks * cvrFor(g, id) * eff * cutFactor * jit());
      rec.spend = spend; rec.clicks = clicks; rec.orders = orders; rec.eff = eff;
      rec.rev = orders * p.aov;
      var claim = t.claim;
      if (id === 'meta' && g.ios) claim *= 0.7;
      rec.claimRev = orders * claim * p.aov;
      if (g.conv[id] !== undefined) g.conv[id] += orders;
      visitors += clicks;
      shopOrders += orders;
      R.spend += spend;
    });

    // Brand searches from Buzz (awareness last weeks). Real orders, but search tools claim them.
    var brandSearches = g.buzz;
    var brandOrders = Math.round(brandSearches * BRAND_CVR * cutFactor * jit());
    var buzzTotal = g.buzzBy.meta + g.buzzBy.tiktok + g.buzzBy.infl;
    ['meta', 'tiktok'].forEach(function (id) {
      if (!R.tools[id]) return;
      var share = buzzTotal > 0 ? g.buzzBy[id] / buzzTotal : 0;
      R.tools[id].halo = brandOrders * share;
      R.tools[id].rev += R.tools[id].halo * p.aov;
    });
    ['google', 'pmax', 'sklik'].forEach(function (id) {
      var rec = R.tools[id];
      if (rec && rec.spend > 0) rec.claimRev += brandOrders * TOOLS[id].brandClaim * p.aov;
    });
    visitors += brandSearches;
    shopOrders += brandOrders;

    // Organic and direct
    var orgOrders = Math.round(p.organic * s * idx * cutFactor * jit());
    visitors += orgOrders / 0.02;
    shopOrders += orgOrders;

    // Influencer discount-code orders

  function renderMonths() {

  function renderSpark() {

  /* ---------- Feed ---------- */
  S.feedLog = [];
  function whoInfo(who) {
    if (E.TOOLS[who]) return { name: toolName(who), ini: BADGE[who], icon: ico(who), c: colorOf(who) };
    var map = {
      petra: { name: t('who_petra'), ini: 'P', c: 'var(--r-retarget)' },

    };

  }
  function msgNode(m) {
    var el = document.createElement('div');

      '<div class="bubble"><span class="who">' + esc(w.name) + '</span><span class="txt">' + esc(m.text) + '</span></div>' +
      (m.chip ? '<span class="chip ' + (m.tone || 'plain') + '">' + esc(m.chip) + '</span>' : '<span></span>');

  }
  function push(m) {
    S.feedLog.push(m);

    if (!S.feedEl) return;

    S.feedEl.appendChild(node);

  function fx() { return !reduced() && S.speed === null; }
  function confetti(el) {

  function shake() {

  function coins(card, n) {
    var cash = document.getElementById('cash');

    var a = card.getBoundingClientRect(), b = cash.getBoundingClientRect();
    if (a.bottom < 0 || a.top > window.innerHeight) return;
    for (var i = 0; i < n; i++) {
      var c = document.createElement('span');
      c.className = 'coin';

      c.style.setProperty('--y0', (a.top + a.height * 0.45).toFixed(0) + 'px');

  /* Pick at most two messages per week by priority: decision > boss > bad > good > tip. */
  var PRI = { boss: 4, bad: 3, good: 2, tip: 1 };
  function weekMessages(R) {
    var g = S.g, p = E.PROFILES[g.profile], out = [];
    R.events.forEach(function (ev) {
      if (ev === 'ios') out.push({ pri: 'boss', who: 'meta', text: t('m_ios'), chip: t('chip_rep'), tone: 'warn' });
      if (ev === 'surge') out.push({ pri: 'bad', who: 'google', text: t('m_surge'), chip: t('chip_cpc'), tone: 'bad' });
      if (ev === 'viral') out.push({ pri: 'boss', who: 'tiktok', text: t('m_viral'), chip: t('chip_buzz'), tone: 'good' });
      if (ev === 'bf') out.push({ pri: 'boss', who: 'tomas', text: t('m_bf'), chip: unitWord(R.orders), tone: 'good' });
      if (ev === 'bailout') out.push({ pri: 'boss', who: 'acct', text: t('m_bailout'), chip: signed(3 * g.fixedMonth * g.s), tone: 'warn' });
      if (ev === 'bankrupt') out.push({ pri: 'boss', who: 'acct', text: t('m_bankrupt'), chip: kc(g.cash), tone: 'bad' });
    });
    Object.keys(R.tools).forEach(function (id) {
      var r = R.tools[id];
      if (r.capped && !S.capWarned[id + R.month]) { S.capWarned[id + R.month] = 1; out.push({ pri: 'bad', who: id, text: t('m_cap'), chip: t('chip_max'), tone: 'warn' }); }
    });
    var prev = g.weeks.slice(-5, -1);
    if (prev.length === 4 && R.week !== E.BF_WEEK) {
      var avg = prev.reduce(function (a, w) { return a + w.orders; }, 0) / 4;
      if (avg > 0 && R.orders >= avg * 1.35 && R.orders - avg >= 3) out.push({ pri: 'good', who: 'tomas', text: t('m_busy'), chip: unitWord(R.orders), tone: 'good' });
    }
    if (R.week % 4 === 1) {
      ['meta', 'pmax'].forEach(function (id) {
        var r = R.tools[id];
        if (r && r.spend > 0 && g.conv[id] < 50) out.push({ pri: 'tip', who: 'petra', text: t('m_learn', { t: toolName(id) }), chip: t('chip_learn', { n: nf(Math.min(50, g.conv[id])) }), tone: 'info' });
      });
    }
    ['tiktok', 'meta'].forEach(function (id) {
      var r = R.tools[id];
      if (r && r.halo >= 1 && !S.tipsShown['saw' + id + R.month] && Math.random() < 0.25) {
        S.tipsShown['saw' + id + R.month] = 1;
        out.push({ pri: 'good', who: 'customer', text: t('m_saw', { t: toolName(id) }), chip: t('chip_buzz'), tone: 'good' });
      }
    });
    // Tips: at most one every 4 weeks
    if (R.week - S.lastTip >= 4) {
      var tip = null;
      if (!tip && p.eshop && g.ready.feed === null && R.week >= 2) tip = { who: 'petra', text: t('tip_feed'), chip: t('chip_tools'), tone: 'info' };
      if (!tip && g.email.freq === 0 && R.week >= 5) tip = { who: 'petra', text: t('tip_email'), chip: short(g.list) + ' ' + t('listUnit'), tone: 'info' };
      if (!tip && R.tools.criteo && R.tools.criteo.spend > 0 && !S.tipsShown.criteo) { S.tipsShown.criteo = 1; tip = { who: 'petra', text: t('tip_criteo'), chip: '×2', tone: 'warn' }; }
      if (!tip && g.weeks.length > 6) {
        var b4 = g.weeks[g.weeks.length - 5];
        var awareOff = !(g.budgets.meta > 0) && !(g.budgets.tiktok > 0 && E.isReady(g, 'tiktok'));
        if (awareOff && b4 && b4.brandOrders > 2 && R.brandOrders < b4.brandOrders * 0.7) tip = { who: 'petra', text: t('tip_buzz'), chip: t('chip_drop', { p: pct(1 - R.brandOrders / b4.brandOrders) }), tone: 'warn' };
      }
      if (tip) { tip.pri = 'tip'; out.push(tip); S.lastTip = R.week; }
    }
    // Setup finished this week
    ['feed', 'video', 'flows'].forEach(function (k) {
      if (g.ready[k] === R.week + 1) out.push({ pri: 'good', who: 'petra', text: t('tip_ready', { x: k === 'feed' ? 'Feed' : (k === 'video' ? (lang === 'cs' ? 'Video' : 'Video') : t('flows')) }), chip: '✓', tone: 'good' });
    });
    out.sort(function (a, b) { return PRI[b.pri] - PRI[a.pri]; });
    return out.slice(0, 2).map(function (m) { m.kind = m.pri === 'boss' ? 'boss' : 'msg'; return m; });
  }

  function monthMessages(m) {
    var g = S.g, p = E.PROFILES[g.profile], out = [];
    out.push({ kind: 'stamp', title: monthName(m.month), stars: m.stars, profit: m.net });
    var claim = 0, real = 0, best = null, worst = null;
    Object.keys(m.tools).forEach(function (id) {
      var a = m.tools[id];
      claim += a.claimRev; real += a.rev;
      if (a.spend > 0) {
        var pr = a.rev * p.margin - a.spend;
        if (!best || pr > best.pr) best = { id: id, pr: pr, pno: a.rev > 0 ? a.spend / a.rev : null };
        if (!worst || pr < worst.pr) worst = { id: id, pr: pr };
      }
    });
    if (claim > 0) out.push({ kind: 'msg', who: 'acct', text: t('m_claim', { a: short(claim) + ' Kč', b: short(real) + ' Kč' }), chip: '×' + nf(claim / Math.max(1, real), 1), tone: 'warn' });
    if (best && best.pr > 0) out.push({ kind: 'msg', who: 'petra', text: t('m_fire', { t: toolName(best.id) }), chip: 'PNO ' + (best.pno !== null ? pct(best.pno) : '—'), tone: 'good' });
    if (worst && worst.pr < 0) out.push({ kind: 'msg', who: 'acct', text: t('m_lost', { t: toolName(worst.id) }), chip: signed(worst.pr), tone: 'bad' });
    return out;
  }

  /* ---------- Decisions ---------- */
  function decisionCopy(d) {
    var who = 'petra', text, opts;
    if (d.type === 'influencer') { text = t('d_infl'); opts = [['yes', t('o_yes'), short(d.cost) + ' Kč'], ['no', t('o_no'), '']]; }
    if (d.type === 'pricewar') { who = 'heureka'; text = t('d_war'); opts = [['match', t('o_match'), t('s_margin')], ['keep', t('o_keep'), t('s_conv')]]; }
    if (d.type === 'blackfriday') { text = t('d_bf'); opts = [['all', t('o_all'), t('s_x2')], ['search', t('o_search'), t('s_x2s')], ['skip', t('o_skip'), '']]; }
    if (d.type === 'cutoff') { who = 'tomas'; text = t('d_cutoff'); opts = [['pause', t('o_pause'), ''], ['keep', t('o_keepgoing'), '']]; }
    if (d.type === 'creatives') { text = t('d_cr', { t: toolName(d.tool) }); opts = [['yes', t('o_yes'), short(d.cost) + ' Kč'], ['no', t('o_later'), '']]; }
    return { who: who, text: text, opts: opts };
  }
  function showDecision(d, redraw) {
    S.decision = d;
    var c = decisionCopy(d);
    if (!redraw) push({ kind: 'boss', who: c.who, text: c.text, chip: '?', tone: 'warn' });
    var box = document.getElementById('replies');
    if (box) {
      box.innerHTML = c.opts.map(function (o) {
        return '<button type="button" class="btn" data-act="decide" data-v="' + o[0] + '">' + esc(o[1]) + (o[2] ? '<small>' + esc(o[2]) + '</small>' : '') + '</button>';
      }).join('');
      var first = box.querySelector('button');
      if (first && !redraw) first.focus({ preventScroll: true });
    }
    renderControls();
  }
  function answer(choice) {
    var d = S.decision;
    if (!d) return;
    var c = decisionCopy(d);
    var opt = c.opts.filter(function (o) { return o[0] === choice; })[0];
    E.decide(S.g, d, choice);
    push({ kind: 'me', text: opt ? opt[1] : choice });
    S.decision = null;
    var box = document.getElementById('replies');
    if (box) box.innerHTML = '';
    updateAll();
    S.playing = true;
    renderControls();
    tick();
  }

  /* ---------- Game loop ---------- */
  function startGame() {
    var pk = S.pick;
    store.profile = pk.profile; store.size = pk.size; saveStore();
    var today = new Date();
    var seed = pk.mode === 'daily' ? dailySeed(today) : Math.floor(Math.random() * 4294967296);
    S.g = E.newGame({ profile: pk.profile, size: pk.size, seed: seed, daily: pk.mode === 'daily' });
    S.g.dayNo = dayNumber(today);
    S.playing = false; S.decision = null; S.monthStarted = false; S.lastTip = -99; S.tipsShown = {}; S.capWarned = {};
    S.feedLog = [];
    S.screen = 'game';
    render();
    push({ kind: 'msg', who: 'petra', text: t('m_hello'), chip: '3', tone: 'info' });
    push({ kind: 'msg', who: 'petra', text: t('m_tap') });
    push({ kind: 'msg', who: 'petra', text: t('m_press'), chip: '▶', tone: 'info' });
  }

  function play() {
    var g = S.g;
    if (!g || g.over || S.decision || S.playing) return;
    if (!S.monthStarted) {
      var before = {};
      ['meta', 'pmax', 'tiktok'].forEach(function (id) { before[id] = g.swing[id]; });
      E.startMonth(g);
      ['meta', 'pmax', 'tiktok'].forEach(function (id) {
        if (g.swing[id] > before[id]) push({ kind: 'msg', who: 'petra', text: t('m_swing', { t: toolName(id) }), chip: '−15 %', tone: 'warn' });
      });
      S.monthStarted = true;
    }
    S.playing = true;
    renderControls();
    tick();
  }
  function pause() {
    S.playing = false;
    clearTimeout(S.timer);
    renderControls();
  }
  function tickDelay() { return S.speed !== null ? S.speed : (reduced() ? 450 : 1000); }
  function tick() {
    clearTimeout(S.timer);
    if (!S.playing || !S.g) return;
    var r = E.stepWeek(S.g);
    if (!r) { S.playing = false; finish(); return; }
    if (r.decision) { S.playing = false; showDecision(r.decision); return; }
    onWeek(r.week);
    if (S.g.over) { S.playing = false; renderControls(); S.timer = setTimeout(finish, S.speed !== null ? 0 : 1200); return; }
    if (r.week.monthEnd) { S.playing = false; S.monthStarted = false; renderControls(); return; }
    S.timer = setTimeout(tick, tickDelay());
  }
  function onWeek(R) {
    weekMessages(R).forEach(push);
    if (R.monthEnd) monthMessages(R.monthEnd).forEach(push);
    animateCash(R.cashAfter);
    renderDock(); renderMeters(); renderMonths(); renderSpark(); renderControls(); renderMonthStats();
    S.coinBudget = 12;
    if (!reduced()) {
      Object.keys(R.tools).forEach(function (id) {
        var r = R.tools[id], n = Math.round(r.orders + (r.halo || 0));
        if (n <= 0) return;
        var card = document.querySelector('.tool[data-v="' + id + '"]');
        if (!card) return;
        card.classList.add('bump');
        var k = Math.min(3, Math.ceil(n / 6), S.coinBudget || 0);
        S.coinBudget = (S.coinBudget || 0) - k;
        coins(card, k);
        var f = document.createElement('span');
        f.className = 'float';
        f.textContent = '+' + n;
        card.appendChild(f);
      });
    }
  }
  function animateCash(to) {
    var el = document.getElementById('cash');
    if (!el) return;
    var from = S.cashShown, t0 = null, dur = reduced() || S.speed !== null ? 0 : 600;
    S.cashShown = to;
    if (fx() && Math.round(to) !== Math.round(from)) {
      el.classList.remove('up', 'down');
      void el.offsetWidth;
      el.classList.add(to > from ? 'up' : 'down');
    }
    if (!dur) { el.textContent = kc(to); return; }
    function stepAnim(ts) {
      if (t0 === null) t0 = ts;
      var k = Math.min(1, (ts - t0) / dur);
      el.textContent = kc(from + (to - from) * (1 - Math.pow(1 - k, 3)));
      if (k < 1) requestAnimationFrame(stepAnim);
    }
    requestAnimationFrame(stepAnim);
  }
  function finish() {
    var g = S.g;
    if (!g) return;
    var pr = E.profit(g);

      'Ceny bez DPH. Výsledky kolísají náhodně o ±7 %. Události v denní výzvě jsou pro všechny stejné.'
    ]
  };

  /* ---------- Events ---------- */
  document.addEventListener('click', function (e) {
    var el = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!el) {
      if (e.target === layer) closeSheet();
      return;
    }
    var act = el.getAttribute('data-act'), v = el.getAttribute('data-v');
    var g = S.g;
    switch (act) {
      case 'lang': setLang(lang === 'cs' ? 'en' : 'cs'); break;
      case 'data': openData(); break;
      case 'close': closeSheet(); break;
      case 'pick-profile': S.pick.profile = v; renderStart(); break;
      case 'pick-size': S.pick.size = v; renderStart(); break;
      case 'pick-mode': S.pick.mode = v; renderStart(); break;
      case 'start': startGame(); break;
      case 'play': play(); break;
      case 'pause': pause(); break;
      case 'tool': openSheet(v); break;
      case 'decide': answer(v); break;
      case 'budget': if (!S.playing) { g.budgets[el.getAttribute('data-tool')] = Number(v); openSheet(S.sheet); renderDock(); } break;
      case 'freq': if (!S.playing) { g.email.freq = Number(v); openSheet(S.sheet); renderDock(); } break;
      case 'aff': if (!S.playing) { g.affiliate = Number(v); openSheet(S.sheet); renderDock(); } break;
      case 'market': if (!S.playing) { g.market = v === 'true'; openSheet(S.sheet); renderDock(); } break;
      case 'setup': if (!S.playing && E.setup(g, v)) { animateCash(g.cash); openSheet(S.sheet); renderDock(); renderSpark(); } break;
      case 'share': doShare(el); break;
      case 'again': S.pick.profile = g.profile; S.pick.size = g.sizeKey; startGame(); break;
      case 'newbiz': S.screen = 'start'; S.g = null; closeSheet(); render(); break;
    }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && S.sheet) { closeSheet(); return; }
    if ((e.key === ' ' || e.code === 'Space') && S.screen === 'game' && !S.sheet && (e.target === document.body || e.target === root)) {
      e.preventDefault();
      if (S.playing) pause(); else play();
    }
  });
  document.addEventListener('visibilitychange', function () { if (document.hidden && S.playing) pause(); });

  /* Test hook */
  window.BudgetBandit = {
    engine: E, state: function () { return S; },
    setSpeed: function (ms) { S.speed = ms; },
    start: function (profile, size, mode) { S.pick = { profile: profile, size: size, mode: mode || 'daily' }; startGame(); }
  };

  render();
})();
</script>
</body>
</html>
